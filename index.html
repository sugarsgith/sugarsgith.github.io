<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111318">
<title>スロット実戦メモ</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#16181d;--sub:#5d6470;--border:#d9dde3;--accent:#2563eb}
@media (prefers-color-scheme:dark){:root{--bg:#111318;--card:#1b1e25;--text:#eceef2;--sub:#a0a7b4;--border:#333845;--accent:#5b8cff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
main{max-width:520px;margin:0 auto;padding:24px 16px 60px}
h1{font-size:22px;margin:0 0 4px}
p{color:var(--sub);font-size:13px;margin:0 0 18px}
a.m{display:block;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px 16px;margin:0 0 14px;text-decoration:none;color:var(--text);min-height:88px}
a.m:active{transform:scale(.98)}
a.m b{display:block;font-size:19px;margin-bottom:2px}
a.m span{display:block;font-size:13px;color:var(--sub)}
a.m i{font-style:normal;color:var(--accent);font-weight:700;font-size:13px}
.note{font-size:12px;color:var(--sub);margin-top:20px}
</style>
</head>
<body>
<noscript><div style="padding:12px;background:#fde2e2;color:#900;font-weight:bold">この画面ではメモ機能が動きません。SafariかChromeで開き直してください。</div></noscript>
<main>
<h1>スロット実戦メモ</h1>

<a class="m" id="go-enen2" href="enen2/"><b>L炎炎ノ消防隊2</b><span>SANKYO ・ 朝イチ／途中から ・ 終了画面／キャラ紹介</span><i>開く →</i></a>
<div class="note">ホーム画面に追加する場合は、各機種のページを開いてから追加すると直接開けます。</div>
</main>
</body>
</html>
